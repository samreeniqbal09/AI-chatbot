<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ece5dd;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.chat-container{
width:100%;
max-width:420px;
height:90vh;
background:white;
display:flex;
flex-direction:column;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 15px gray;
}

.header{
background:#007bff;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.chat-box{
flex:1;
padding:15px;
overflow-y:auto;
background:#f5f5f5;
display:flex;
flex-direction:column;
}

.message{
padding:10px 14px;
margin:6px 0;
border-radius:15px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#007bff;
color:white;
align-self:flex-end;
}

.bot{
background:#e0e0e0;
color:black;
align-self:flex-start;
}

.input-area{
display:flex;
padding:10px;
background:white;
}

input{
flex:1;
padding:10px;
border:1px solid #ccc;
border-radius:20px;
outline:none;
}

button{
margin-left:8px;
padding:10px 15px;
border:none;
background:#007bff;
color:white;
border-radius:20px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.clear-btn{
margin:10px;
background:red;
}

</style>

</head>

<body>

<div class="chat-container">

<div class="header">
AI Chatbot
</div>

<div id="chatBox" class="chat-box"></div>

<div class="input-area">

<input
id="question"
type="text"
placeholder="Type your message...">

<button onclick="askBot()">Send</button>

</div>

<button
class="clear-btn"
onclick="clearChat()">
Clear Chat
</button>

</div>

<script>

const chatBox=document.getElementById("chatBox");

function addMessage(text,type){

let div=document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

chatBox.appendChild(div);

chatBox.scrollTop=chatBox.scrollHeight;

}

function askBot(){

let input=document.getElementById("question");

let question=input.value.trim();

if(question=="") return;

addMessage(question,"user");

input.value="";

let loading=document.createElement("div");

loading.className="message bot";

loading.id="loading";

loading.innerHTML="Thinking...";

chatBox.appendChild(loading);

chatBox.scrollTop=chatBox.scrollHeight;

fetch("/api/ask", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

})

.then(response=>response.json())

.then(data=>{

document.getElementById("loading").remove();

addMessage(data.answer,"bot");

})

.catch(error=>{

document.getElementById("loading").remove();

addMessage("Cannot connect to Flask server.","bot");

});

}

function clearChat(){

chatBox.innerHTML="";

}

document.getElementById("question").addEventListener("keypress",function(e){

if(e.key==="Enter"){

askBot();

}

});

</script>

</body>
</html>
